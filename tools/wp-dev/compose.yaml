name: ${COMPOSE_PROJECT_NAME:-bookshelf-wp}

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', true );
    define( 'SCRIPT_DEBUG', true );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_DEVELOPMENT_MODE', 'theme' );

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 180s
      start_interval: 2s

  wordpress:
    image: wordpress:${WP_VERSION:-7.1.4}-php8.4-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:?set WP_PORT}:80"
    environment:
      <<: *wp-env
    volumes:
      - wp:/var/www/html
      - ${THEME_SOURCE:-../../wordpress}:${THEME_TARGET:-/var/www/html/wp-content/themes/bookshelf}:ro

  cli:
    image: wordpress:cli-php8.4
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - wp:/var/www/html
      - ${THEME_SOURCE:-../../wordpress}:${THEME_TARGET:-/var/www/html/wp-content/themes/bookshelf}:ro
      - .:/opt/wp-dev:ro
      - ${DIST_DIR:-../../dist}:/opt/dist:ro

volumes:
  db:
  wp:
