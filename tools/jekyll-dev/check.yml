# Overlay for every check build. build-sites.sh deletes the site's remote_theme
# line, and this file loads the same theme from the local gem instead. The baseurl
# makes every link go through relative_url, and the fixed time makes builds
# reproducible.
theme: jekyll-theme-readerly
url: http://localhost:4000
baseurl: /sub
time: 2026-11-12T12:00:00Z
liquid:
  error_mode: strict
  strict_filters: true
