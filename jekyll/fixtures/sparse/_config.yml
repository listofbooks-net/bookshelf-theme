# One post per row of the theme's "when it is missing" table, under a baseurl.
# No author, nav, footer, newsletter, archive page, books or praise.
title: Sparse
baseurl: /sub
permalink: /:title/
remote_theme: listofbooks-net/jekyll-theme-readerly@v1
plugins:
  - jekyll-remote-theme
liquid:
  error_mode: strict
  strict_filters: true
# GitHub Pages gives posts the post layout through jekyll-default-layout.
# Jekyll 4 has no such plugin, so the fixture sets it for both.
defaults:
  - scope: { type: posts }
    values: { layout: post }
# A protocol-relative URL, which the theme must leave as written.
readerly:
  favicon: //example.com/favicon.svg
