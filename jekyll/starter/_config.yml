# Site settings. Edit these, commit, and GitHub Pages rebuilds the site.
title: My book notes
tagline: Reviews of the books I read
description: Honest reviews of the books I read.
lang: en

# Leave these two as they are: they load the Readerly theme.
remote_theme: listofbooks-net/jekyll-theme-readerly@v1
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-feed

# Reviews live at /<title>/ and the home page shows nine per page.
permalink: /:title/
paginate: 9

# Who writes the reviews. Uncomment and fill in to show a byline and a bio
# card under each review.
# author:
#   name: Your Name
#   avatar: /assets/img/me.jpg
#   bio: One or two sentences about you and what you read.
#   url: /about/

# Every Readerly setting is optional. The theme README lists them all.
readerly:
  style: auto          # auto (follows the visitor's system), paper or lamplight
  style_toggle: true   # show the light/dark button in the header
  # nav:
  #   - { title: Reviews, url: / }
  #   - { title: About, url: /about/ }
  # footer:
  #   about: A sentence about this site.
  #   copyright: All reviews are my own.
  # newsletter:
  #   action: https://example.com/your-signup-form-url
  #   heading: Get new reviews by email.

exclude:
  - README.md
  - LICENSE
