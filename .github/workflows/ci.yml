name: CI

# GitHub Actions is disabled on this repository on purpose. Run this file
# locally with act, for example:  act pull_request -W .github/workflows/ci.yml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tokens:
    name: Design tokens are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-tokens.mjs --check

  theme-json:
    name: theme.json and style variations match the WordPress schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix tools --no-audit --no-fund
      - run: node tools/check-theme-json.mjs

  php-lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The files are copied into the container, not bind-mounted, so this
      # works the same on a hosted runner and under act.
      - name: php -l on every PHP file, theme and dev harness
        run: |
          set -euo pipefail
          cid="$(docker create "php:${{ matrix.php }}-cli" sh -c 'find /theme /harness -name "*.php" -print0 | sort -z | xargs -0 -n1 php -l')"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker cp wordpress/. "$cid:/theme"
          docker cp tools/wp-dev/. "$cid:/harness"
          docker start -a "$cid"

  jekyll:
    name: Jekyll theme on GitHub Pages (Jekyll 3.10) and Jekyll 4.4
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Builds the demo, the starter and the fixtures on both engines. A build
      # that prints any warning fails.
      - name: Build every site on both engines
        run: |
          set -euo pipefail
          tools/jekyll-dev/jekyll-dev.sh images
          tools/jekyll-dev/jekyll-dev.sh build
      # Same-HTML, link, design-parity and browser checks, in the Playwright
      # image that matches tools/package.json.
      - name: Check the builds
        run: |
          set -euo pipefail
          cid="$(docker create -w /repo mcr.microsoft.com/playwright:v1.61.0-noble bash -c 'npm ci --prefix tools --no-audit --no-fund >/dev/null && node tools/jekyll-dev/check-builds.mjs tools/jekyll-dev/out')"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker cp . "$cid:/repo"
          docker start -a "$cid"

  hugo:
    name: Hugo theme on the minimum Hugo version and the latest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Builds the demo and the fixtures on both versions. A build that writes
      # anything to stderr fails.
      - name: Build every site on both Hugo versions
        run: |
          set -euo pipefail
          tools/hugo-dev/hugo-dev.sh images
          tools/hugo-dev/hugo-dev.sh build
      # Same-HTML, link, design-parity and browser checks, in the Playwright
      # image that matches tools/package.json.
      - name: Check the builds
        run: |
          set -euo pipefail
          cid="$(docker create -w /repo mcr.microsoft.com/playwright:v1.61.0-noble bash -c 'npm ci --prefix tools --no-audit --no-fund >/dev/null && node tools/hugo-dev/check-builds.mjs tools/hugo-dev/out')"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker cp . "$cid:/repo"
          docker start -a "$cid"
